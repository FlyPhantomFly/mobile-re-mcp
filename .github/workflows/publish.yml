name: Publish to npm

# Publishes with npm "trusted publishing" (OIDC): no npm token is stored in GitHub.
# One-time setup (npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions):
#   Organization/user : FlyPhantomFly
#   Repository        : mobile-re-mcp
#   Workflow filename : publish.yml
#   Environment       : npm-publish
# These values must match this file exactly (a mismatch shows up as E404 on publish).

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    # Create this environment in GitHub (Settings -> Environments) and add yourself as a
    # required reviewer, so every publish needs a manual approval.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token npm exchanges for a publish credential

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # never use caches in release builds
          # Deliberately NO registry-url: it makes setup-node write an
          # "_authToken=${NODE_AUTH_TOKEN}" line into .npmrc, which stops npm from
          # doing the OIDC exchange (ENEEDAUTH / E404). npm defaults to registry.npmjs.org.

      - name: Check npm version (trusted publishing needs npm >= 11.5.1)
        run: |
          node --version
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          if ! printf '%s\n' "11.5.1" "${npm_version}" | sort -V -C; then
            echo "::error::npm ${npm_version} is too old for trusted publishing (need >= 11.5.1)"
            exit 1
          fi

      - name: Check release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "v${package_version}" ] && [ "${RELEASE_TAG}" != "${package_version}" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${package_version}'"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
